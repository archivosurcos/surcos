return html`<div className="grid lg:grid-cols-[340px_1fr] gap-8"><aside>
<${cover} d=${d} big=${1}/>
<dl className="mt-4 text-sm divide-y divide-line border-y border-line">${[["Artista",d.a],["Año",d.y],["Ciudad",d.c],["Provincia",pn(d.p)],["Sello",d.l],["Formato",d.f],["Tirada est.",d.r]].map(([a,b])=>html`<div key=${a} className="flex justify-between py-1.5 gap-3"><dt className="text-mute">${a}</dt><dd className="font-mono text-right">${b}</dd></div>`)}</dl>
<div className="mt-4 flex gap-2 flex-wrap">${d.ln.split("").map(k=>html`<a key=${k} href="#" onClick=${e=>e.preventDefault()} className="border border-ink px-2.5 py-1 text-sm hover:bg-ink hover:text-paper">${LK[k]} ↗️</a>`)}</div>
<p className="text-[11px] text-mute mt-1">Enlaces externos de ejemplo. SURCOS no aloja audio.</p>
<h3 className="font-serif font-bold text-lg mt-6">Créditos</h3><ul className="mt-1 border-l border-line pl-3">${d.cr.map(c=>{const [ro,nm]=c.split("|");return html`<li key=${c} className="py-1 text-sm"><span className="font-mono text-[11px] text-mute uppercase">${ro}</span><br/><button className="underline decoration-sello underline-offset-2 text-left" onClick=${()=>go({n:"q",q:nm})}>${nm}</button></li>`})}</ul></aside>
<section><div className="font-mono text-xs text-mute uppercase">Reseña histórica oficial</div><h1 className="font-serif font-bold text-3xl leading-tight mt-1">${d.t}</h1><p className="font-serif italic text-mute">${d.a}</p>
<p className="font-serif text-lg leading-relaxed mt-4 border-l-4 border-sello pl-4">${d.h}</p>
<p className="mt-4 text-sm"><span className="font-mono text-xs text-mute">TEMAS: </span>${d.tr.split("/").join(" · ")}</p>
<div className="mt-8 flex items-baseline gap-3 border-b border-ink pb-1"><h2 className="font-serif font-bold text-xl">Muro de la comunidad</h2><span className="font-mono text-xs text-mute">${n} reseñas</span></div>
<div className="font-mono text-sm mt-2">${n>=5&&av?html`Promedio: <b className="text-sello">${av}</b>/5`:html`<span className="text-mute">Promedio oculto: faltan ${Math.max(0,5-n)} reseñas.</span>`}</div>
${mine.map(r=>html`<${Rv} key=${r.id} r=${r} go=${go} onVote=${onVote}/>)}${n===0&&html<p className="py-4 text-mute">Todavía nadie escribió sobre este disco.</p>`}
<${Form} d=${d} add=${add}/></section></div>`}

function Prov({code,go}){const [dc,setDc]=useState(""),[ft,setFt]=useState("");const sc=SC[code];
const L=D.filter(d=>d.p===code&&(!dc||dec(d.y)===dc)&&(!ft||d.f===ft));
return html`<div><button onClick=${()=>go({n:"h"})} className="font-mono text-xs underline">← Portada federal</button>
<h1 className="font-serif font-bold text-4xl mt-2">${pn(code)}</h1>
<div className="mt-4 flex gap-1 flex-wrap ov"><${Chip} on=${!dc} onClick=${()=>setDc("")}>Todas</${Chip}>${DEC.map(x=>html`<${Chip} key=${x} on=${dc===x} onClick=${()=>setDc(x)}>${x}</${Chip}>`)}</div>
<section className="mt-5 border-y border-ink py-4"><div className="font-mono text-xs text-mute uppercase">Reseña histórica de la escena${dc?" · "+dc:""}</div>
<p className="font-serif text-lg leading-relaxed mt-2 max-w-2xl">${sc?(dc?(sc[dc]||"Todavía no hay una reseña cargada para esta década."):sc.g):"Todavía no hay escena cargada para esta provincia. El archivo se está construyendo de a poco."}</p></section>
<div className="mt-5 flex gap-1 flex-wrap ov"><${Chip} on=${!ft} onClick=${()=>setFt("")}>Todos los formatos</${Chip}>${FMT.map(x=>html`<${Chip} key=${x} on=${ft===x} onClick=${()=>setFt(x)}>${x}</${Chip}>`)}</div>
<div className="mt-5 grid grid-cols-2 md:grid-cols-4 gap-5">${L.map(d=>html`<${Card} key=${d.id} d=${d} go=${go}/>`)}</div>
${L.length===0&&html`<p className="py-8 text-mute">No hay lanzamientos con esos filtros.</p>}</div>}

function Home({rs,go}){const [tab,setTab]=useState("h");
const cnt=c=>({s:SC[c]?Object.keys(SC[c]).length-1:0,d:D.filter(d=>d.p===c).length});
const hist=[...D].reverse().slice(0,4),com=rs.slice(0,5);
return html`<div><p className="font-serif text-2xl md:text-3xl leading-snug max-w-2xl">Un archivo de las escenas, los sellos caseros y los discos de todo el país.</p>
<h2 className="font-mono text-xs uppercase text-mute mt-8 mb-2">Explorador federal · 23 provincias + CABA</h2>
<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-px bg-line border border-line">${PROV.map(([c,n])=>{const k=cnt(c);return html`<button key=${c} onClick=${()=>go({n:"p",c})} className=${"bg-paper p-2.5 text-left hover:bg-ink hover:text-paper "+(k.d?"":"text-mute")}><div className="font-mono text-[11px] text-sello">${c}</div><div className="font-serif font-bold text-sm leading-tight">${n}</div><div className="font-mono text-[10px] mt-1">${k.s} escenas · ${k.d} discos</div></button>`})}</div>
<h2 className="font-mono text-xs uppercase text-mute mt-10">Actividad reciente</h2>
<div className="md:hidden flex mt-2 border-b border-ink">${[["h","Reseñas históricas"],["c","Comunidad"]].map(([k,l])=>html`<button key=${k} onClick=${()=>setTab(k)} className=${"flex-1 py-2 text-sm "+(tab===k?"bg-ink text-paper":"")}>${l}</button>`)}</div>
<div className="grid md:grid-cols-2 gap-8 mt-3"><div className=${tab==="h"?"block":"hidden md:block"}><h3 className="font-serif font-bold text-lg hidden md:block border-b border-ink pb-1">Reseñas históricas</h3>${hist.map(d=>html`<button key=${d.id} onClick=${()=>go({n:"d",id:d.id})} className="text-left w-full border-b border-line py-3"><div className="font-mono text-[11px] text-mute">${d.y} · ${d.c} · ${d.f}</div><div className="font-serif font-bold">${d.t} <span className="font-normal text-mute">— ${d.a}</span></div><p className="text-sm text-mute line-clamp-2">${d.h}</p></button>`)}</div>
<div className=${tab==="c"?"block":"hidden md:block"}><h3 className="font-serif font-bold text-lg hidden md:block border-b border-ink pb-1">Reseñas y bitácoras de la comunidad</h3>${com.map(r=>{const d=D.find(o=>o.id===r.d);if(!d)return null;return html`<button key=${r.id} onClick=${()=>go({n:"d",id:d.id})} className="text-left w-full border-b border-line py-3"><div className="font-mono text-[11px] text-mute">${r.k==="c"?"CRÍTICA":"BITÁCORA"} · ${r.u}${r.s?" · "+r.s+"/5":""}</div><div className="font-serif font-bold">${d.t}</div><p className="text-sm text-mute line-clamp-2">${r.x}</p></button>})}</div></div></div>}

function Search({q,go}){const t=q.toLowerCase();const L=D.filter(d=>[d.t,d.a,d.c,d.l,pn(d.p),...d.cr.map(c=>c.split("|")[1])].join(" ").toLowerCase().includes(t));
return html`<div><h1 className="font-serif font-bold text-2xl">Resultados para “${q}”</h1><div className="mt-5 grid grid-cols-2 md:grid-cols-4 gap-5">${L.map(d=>html`<${Card} key=${d.id} d=${d} go=${go}/>)}</div>${L.length===0&&html<p className="py-6 text-mute">Sin resultados.</p>}</div>}

function App(){
  const [v,setV]=useState({n:"h"}),[q,setQ]=useState(""),[rs,setRs]=useState(R0),[dbOk,setDbOk]=useState(false);

  useEffect(()=>{
    if(!hasDb)return;
    fetch(SUPABASE_URL+"/rest/v1/surcos_resenas?select=*&order=id.desc",{headers:dbHeaders()})
      .then(res=>{if(!res.ok)throw new Error();return res.json();})
      .then(rows=>{setDbOk(true);setRs([...rows.map(mapRow),...R0]);})
      .catch(()=>setDbOk(false));
  },[]);

  const addReview=async item=>{
    if(!hasDb){
      setRs([{...item,id:"local-"+Date.now(),a:0,b:0,db:false},...rs]);
      return true;
    }
    try{
      const res=await fetch(SUPABASE_URL+"/rest/v1/surcos_resenas",{
        method:"POST",
        headers:{...dbHeaders(),Prefer:"return=representation"},
        body:JSON.stringify({
          disco_id:item.d,
          usuario:item.u,
          tipo:item.k,
          puntaje:item.s,
          texto:item.x,
          temas:item.hl,
          tags:item.tg,
          puente_id:item.br,
          votos_a:0,
          votos_b:0
        })
      });
      if(!res.ok)return false;
      const saved=await res.json();
      if(saved&&saved[0]){setDbOk(true);setRs([mapRow(saved[0]),...rs]);return true;}
      return false;
    }catch(e){return false;}
  };

  const handleVote=(r,key,delta)=>{
    if(!hasDb||!r.db)return;
    const nextA=(r.a||0)+(key==="a"?delta:0);
    const nextB=(r.b||0)+(key==="b"?delta:0);
    fetch(SUPABASE_URL+"/rest/v1/surcos_resenas?id=eq."+r.id,{
      method:"PATCH",
      headers:dbHeaders(),
      body:JSON.stringify({votos_a:Math.max(0,nextA),votos_b:Math.max(0,nextB)})
    }).catch(()=>{});
  };

  const go=x=>{setV(x);setQ("");window.scrollTo(0,0)};
  const hit=q.trim().length>1?D.filter(d=>[d.t,d.a,d.c,d.l,pn(d.p),...d.cr.map(c=>c.split("|")[1])].join(" ").toLowerCase().includes(q.trim().toLowerCase())).slice(0,6):[];
  return html`<div className="max-w-5xl mx-auto px-4 pb-16"><header className="py-4 border-b border-ink flex items-center gap-4 flex-wrap relative"><button onClick=${()=>go({n:"h"})} aria-label="SURCOS, ir a la portada" className="text-3xl"><${Logo}/><span className="font-serif font-bold text-sello">.</span></button>
<div className="flex-1 min-w-[220px] relative"><input value=${q} onChange=${e=>setQ(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter"&&q.trim())go({n:"q",q:q.trim()})}} placeholder="Buscá disco, artista, ciudad, sello o músico…" className="w-full border border-ink bg-transparent px-3 py-2 text-sm" aria-label="Buscar"/>
${hit.length>0&&html`<div className="absolute z-10 left-0 right-0 bg-paper border border-ink mt-1">${hit.map(d=>html`<button key=${d.id} onClick=${()=>go({n:"d",id:d.id})} className="block w-full text-left px-3 py-2 border-b border-line text-sm"><b>${d.t}</b> · ${d.a} <span className="font-mono text-[11px] text-mute">${d.y} · ${d.c}</span></button>)}</div>}</div></header>
<main className="pt-6">${v.n==="h"?html`<${Home} rs=${rs} go=${go}/>:v.n==="p"?html<${Prov} key=${v.c} code=${v.c} go=${go}/>:v.n==="q"?html<${Search} q=${v.q} go=${go}/>:(()=>{const cur=D.find(o=>o.id===v.id);return cur?html<div><button onClick=${()=>go({n:"p",c:cur.p})} className="font-mono text-xs underline mb-4 block">← ${pn(cur.p)}</button><${Disc} key=${cur.id} d=${cur} rs=${rs} add=${addReview} go=${go} onVote=${handleVote}/></div>:html<div><button onClick=${()=>go({n:"h"})} className="font-mono text-xs underline">← Portada federal</button><p className="py-8 text-mute">No encontramos ese disco.</p></div>`})()}</main>
<footer className="mt-12 pt-4 border-t border-line font-mono text-[11px] text-mute flex justify-between flex-wrap gap-2"><span><${Logo} cls="text-base"/> · archivo musical federal</span><span>${dbOk?"● conectado a base de datos":"○ modo local"}</span></footer></div>`;
}

class EB extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?html`<div className="max-w-xl mx-auto p-6"><p className="font-serif text-xl">Algo falló al mostrar esta pantalla.</p><button onClick=${()=>location.reload()} className="mt-3 border border-ink px-3 py-1 text-sm">Recargar</button></div>`:this.props.children}}
ReactDOM.createRoot(document.getElementById("r")).render(html`<${EB}><${App}/></${EB}>`);
</script></body></html>
