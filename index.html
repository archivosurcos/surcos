        h("div", { className: "flex gap-1 flex-wrap" }, (d.tr ? d.tr.split("/") : []).map(t => h(Chip, { key: t, on: hl.includes(t), onClick: () => tog(hl, setHl, t, 3) }, t))),
        h("label", { className: L }, "Clima y sonido"),
        h("div", { className: "flex gap-1 flex-wrap" }, TAGS.map(t => h(Chip, { key: t, on: tg.includes(t), onClick: () => tog(tg, setTg, t) }, "#" + t))),
        h("label", { className: L }, "Puente: si te gustó este disco, escuchá…"),
        h("select", { value: br, onChange: e => setBr(e.target.value), className: "w-full border border-line bg-paper p-2" },
          h("option", { value: "" }, "Ninguno"),
          D.filter(o => o.id !== d.id).map(o => h("option", { key: o.id, value: o.id }, o.t + " — " + o.a))
        ),
        err ? h("p", { className: "mt-3 text-sm text-sello" }, err) : null,
        h("button", { onClick: send, disabled: busy, className: "mt-4 bg-sello text-paper px-4 py-2 font-semibold disabled:opacity-50" }, busy ? "Publicando..." : "Publicar reseña")
      );
    }

    function Disc({ d, rs, add, go, onVote }) {
      const mine = (rs || []).filter(r => r && r.d === d.id);
      const n = mine.length;
      const av = avg(mine);

      return h("div", { className: "grid lg:grid-cols-[340px_1fr] gap-8" },
        h("aside", null,
          h(Cover, { d: d }),
          h("dl", { className: "mt-4 text-sm divide-y divide-line border-y border-line" },
            [["Artista", d.a], ["Año", d.y], ["Ciudad", d.c], ["Provincia", pn(d.p)], ["Sello", d.l], ["Formato", d.f], ["Tirada est.", d.r]].map(([a, b]) =>
              h("div", { key: a, className: "flex justify-between py-1.5 gap-3" },
                h("dt", { className: "text-mute" }, a),
                h("dd", { className: "font-mono text-right" }, b)
              )
            )
          ),
          h("div", { className: "mt-4 flex gap-2 flex-wrap" },
            d.ln.split("").map(k => h("a", { key: k, href: "#", onClick: e => e.preventDefault(), className: "border border-ink px-2.5 py-1 text-sm hover:bg-ink hover:text-paper" }, LK[k] + " ↗️"))
          ),
          h("h3", { className: "font-serif font-bold text-lg mt-6" }, "Créditos"),
          h("ul", { className: "mt-1 border-l border-line pl-3" },
            d.cr.map(c => {
              const [ro, nm] = c.split("|");
              return h("li", { key: c, className: "py-1 text-sm" },
                h("span", { className: "font-mono text-[11px] text-mute uppercase" }, ro),
                h("br"),
                h("button", { className: "underline decoration-sello underline-offset-2 text-left", onClick: () => go({ n: "q", q: nm }) }, nm)
              );
            })
          )
        ),
        h("section", null,
          h("div", { className: "font-mono text-xs text-mute uppercase" }, "Reseña histórica oficial"),
          h("h1", { className: "font-serif font-bold text-3xl leading-tight mt-1" }, d.t),
          h("p", { className: "font-serif italic text-mute" }, d.a),
          h("p", { className: "font-serif text-lg leading-relaxed mt-4 border-l-4 border-sello pl-4" }, d.h),
          h("p", { className: "mt-4 text-sm" }, h("span", { className: "font-mono text-xs text-mute" }, "TEMAS: "), d.tr.split("/").join(" · ")),
          h("div", { className: "mt-8 flex items-baseline gap-3 border-b border-ink pb-1" },
            h("h2", { className: "font-serif font-bold text-xl" }, "Muro de la comunidad"),
            h("span", { className: "font-mono text-xs text-mute" }, n + " reseñas")
          ),
          h("div", { className: "font-mono text-sm mt-2" },
            n >= 5 && av ? ["Promedio: ", h("b", { key: "av", className: "text-sello" }, av), "/5"] : h("span", { className: "text-mute" }, "Promedio oculto: faltan " + Math.max(0, 5 - n) + " reseñas.")
          ),
          mine.map(r => h(Rv, { key: r.id, r: r, go: go, onVote: onVote })),
          n === 0 ? h("p", { className: "py-4 text-mute" }, "Todavía nadie escribió sobre este disco.") : null,
          h(Form, { d: d, add: add })
        )
      );
    }

    function Prov({ code, go }) {
      const [dc, setDc] = useState("");
      const [ft, setFt] = useState("");
      const sc = SC[code];
      const L = D.filter(d => d.p === code && (!dc || dec(d.y) === dc) && (!ft || d.f === ft));

      return h("div", null,
        h("button", { onClick: () => go({ n: "h" }), className: "font-mono text-xs underline" }, "← Portada federal"),
        h("h1", { className: "font-serif font-bold text-4xl mt-2" }, pn(code)),
        h("div", { className: "mt-4 flex gap-1 flex-wrap" },
          h(Chip, { on: !dc, onClick: () => setDc("") }, "Todas"),
          DEC.map(x => h(Chip, { key: x, on: dc === x, onClick: () => setDc(x) }, x))
        ),
        h("section", { className: "mt-5 border-y border-ink py-4" },
          h("div", { className: "font-mono text-xs text-mute uppercase" }, "Reseña histórica de la escena" + (dc ? " · " + dc : "")),
          h("p", { className: "font-serif text-lg leading-relaxed mt-2 max-w-2xl" },
            sc ? (dc ? (sc[dc] || "Todavía no hay una reseña cargada para esta década.") : sc.g) : "Todavía no hay escena cargada para esta provincia."
          )
        ),
        h("div", { className: "mt-5 flex gap-1 flex-wrap" },
          h(Chip, { on: !ft, onClick: () => setFt("") }, "Todos los formatos"),
          FMT.map(x => h(Chip, { key: x, on: ft === x, onClick: () => setFt(x) }, x))
        ),
        h("div", { className: "mt-5 grid grid-cols-2 md:grid-cols-4 gap-5" }, L.map(d => h(Card, { key: d.id, d: d, go: go }))),
        L.length === 0 ? h("p", { className: "py-8 text-mute" }, "No hay lanzamientos con esos filtros.") : null
      );
    }

    function Home({ rs, go }) {
      const cnt = c => ({ s: SC[c] ? Object.keys(SC[c]).length - 1 : 0, d: D.filter(d => d.p === c).length });
      const hist = [...D].reverse().slice(0, 4);
      const com = rs.slice(0, 5);

      return h("div", null,
        h("p", { className: "font-serif text-2xl md:text-3xl leading-snug max-w-2xl" }, "Un archivo de las escenas, los sellos caseros y los discos de todo el país."),
        h("h2", { className: "font-mono text-xs uppercase text-mute mt-8 mb-2" }, "Explorador federal · 23 provincias + CABA"),
        h("div", { className: "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-px bg-line border border-line" },
          PROV.map(([c, n]) => {
            const k = cnt(c);
            return h("button", { key: c, onClick: () => go({ n: "p", c: c }), className: "bg-paper p-2.5 text-left hover:bg-ink hover:text-paper " + (k.d ? "" : "text-mute") },
              h("div", { className: "font-mono text-[11px] text-sello" }, c),
              h("div", { className: "font-serif font-bold text-sm leading-tight" }, n),
              h("div", { className: "font-mono text-[10px] mt-1" }, k.s + " escenas · " + k.d + " discos")
            );
          })
        ),
        h("h2", { className: "font-mono text-xs uppercase text-mute mt-10" }, "Actividad reciente"),
        h("div", { className: "grid md:grid-cols-2 gap-8 mt-3" },
          h("div", null,
            h("h3", { className: "font-serif font-bold text-lg border-b border-ink pb-1" }, "Reseñas históricas"),
            hist.map(d => h("button", { key: d.id, onClick: () => go({ n: "d", id: d.id }), className: "text-left w-full border-b border-line py-3" },
              h("div", { className: "font-mono text-[11px] text-mute" }, d.y + " · " + d.c + " · " + d.f),
              h("div", { className: "font-serif font-bold" }, d.t + " — " + d.a),
              h("p", { className: "text-sm text-mute" }, d.h)
            ))
          ),
          h("div", null,
            h("h3", { className: "font-serif font-bold text-lg border-b border-ink pb-1" }, "Reseñas y bitácoras de la comunidad"),
            com.map(r => {
              const d = D.find(o => o.id === r.d);
              if (!d) return null;
              return h("button", { key: r.id, onClick: () => go({ n: "d", id: d.id }), className: "text-left w-full border-b border-line py-3" },
                h("div", { className: "font-mono text-[11px] text-mute" }, (r.k === "c" ? "CRÍTICA" : "BITÁCORA") + " · " + r.u + (r.s ? " · " + r.s + "/5" : "")),
                h("div", { className: "font-serif font-bold" }, d.t),
                h("p", { className: "text-sm text-mute" }, r.x)
              );
            })
          )
        )
      );
    }

    function Search({ q, go }) {
      const t = q.toLowerCase();
      const L = D.filter(d => [d.t, d.a, d.c, d.l, pn(d.p), ...d.cr.map(c => c.split("|")[1])].join(" ").toLowerCase().includes(t));
      return h("div", null,
        h("h1", { className: "font-serif font-bold text-2xl" }, "Resultados para “" + q + "”"),
        h("div", { className: "mt-5 grid grid-cols-2 md:grid-cols-4 gap-5" }, L.map(d => h(Card, { key: d.id, d: d, go: go }))),
        L.length === 0 ? h("p", { className: "py-6 text-mute" }, "Sin resultados.") : null
      );
    }

    function App() {
      const [v, setV] = useState({ n: "h" });
      const [q, setQ] = useState("");
      const [rs, setRs] = useState(R0);
      const [dbOk, setDbOk] = useState(false);

      useEffect(() => {
        if (!hasDb) return;
        fetch(SUPABASE_URL + "/rest/v1/surcos_resenas?select=*&order=id.desc", { headers: dbHeaders() })
          .then(res => { if (!res.ok) throw new Error(); return res.json(); })
          .then(rows => { setDbOk(true); setRs([...rows.map(mapRow), ...R0]); })
          .catch(() => setDbOk(false));
      }, []);

      const addReview = async item => {
        if (!hasDb) {
          setRs([{ ...item, id: "local-" + Date.now(), a: 0, b: 0, db: false }, ...rs]);
          return true;
        }
        try {
          const res = await fetch(SUPABASE_URL + "/rest/v1/surcos_resenas", {
            method: "POST",
            headers: { ...dbHeaders(), Prefer: "return=representation" },
            body: JSON.stringify({
              disco_id: item.d, usuario: item.u, tipo: item.k, puntaje: item.s, texto: item.x,
              temas: item.hl, tags: item.tg, puente_id: item.br, votos_a: 0, votos_b: 0
            })
          });
          if (!res.ok) return false;
          const saved = await res.json();
          if (saved && saved[0]) { setDbOk(true); setRs([mapRow(saved[0]), ...rs]); return true; }
          return false;
        } catch (e) { return false; }
      };

      const handleVote = (r, key, delta) => {
        if (!hasDb || !r.db) return;
        const nextA = (r.a || 0) + (key === "a" ? delta : 0);
        const nextB = (r.b || 0) + (key === "b" ? delta : 0);
        fetch(SUPABASE_URL + "/rest/v1/surcos_resenas?id=eq." + r.id, {
          method: "PATCH",
          headers: dbHeaders(),
          body: JSON.stringify({ votos_a: Math.max(0, nextA), votos_b: Math.max(0, nextB) })
        }).catch(() => {});
      };

      const go = x => { setV(x); setQ(""); window.scrollTo(0, 0); };
      const hit = q.trim().length > 1 ? D.filter(d => [d.t, d.a, d.c, d.l, pn(d.p), ...d.cr.map(c => c.split("|")[1])].join(" ").toLowerCase().includes(q.trim().toLowerCase())).slice(0, 6) : [];

      let mainView;
      if (v.n === "h") mainView = h(Home, { rs: rs, go: go });
      else if (v.n === "p") mainView = h(Prov, { key: v.c, code: v.c, go: go });
      else if (v.n === "q") mainView = h(Search, { q: v.q, go: go });
      else {
        const cur = D.find(o => o.id === v.id);
        mainView = cur
          ? h("div", null,
              h("button", { onClick: () => go({ n: "p", c: cur.p }), className: "font-mono text-xs underline mb-4 block" }, "← " + pn(cur.p)),
              h(Disc, { key: cur.id, d: cur, rs: rs, add: addReview, go: go, onVote: handleVote })
            )
          : h("div", null,
              h("button", { onClick: () => go({ n: "h" }), className: "font-mono text-xs underline" }, "← Portada federal"),
              h("p", { className: "py-8 text-mute" }, "No encontramos ese disco.")
            );
      }

      return h("div", { className: "max-w-5xl mx-auto px-4 pb-16" },
        h("header", { className: "py-4 border-b border-ink flex items-center gap-4 flex-wrap relative" },
          h("button", { onClick: () => go({ n: "h" }), className: "text-3xl" }, h(Logo), h("span", { className: "font-serif font-bold text-sello" }, ".")),
          h("div", { className: "flex-1 min-w-[220px] relative" },
            h("input", {
              value: q,
              onChange: e => setQ(e.target.value),
              onKeyDown: e => { if (e.key === "Enter" && q.trim()) go({ n: "q", q: q.trim() }); },
              placeholder: "Buscá disco, artista, ciudad, sello o músico…",
              className: "w-full border border-ink bg-transparent px-3 py-2 text-sm"
            }),
            hit.length > 0 ? h("div", { className: "absolute z-10 left-0 right-0 bg-paper border border-ink mt-1" },
              hit.map(d => h("button", { key: d.id, onClick: () => go({ n: "d", id: d.id }), className: "block w-full text-left px-3 py-2 border-b border-line text-sm" },
                h("b", null, d.t), " · " + d.a + " ", h("span", { className: "font-mono text-[11px] text-mute" }, d.y + " · " + d.c)
              ))
            ) : null
          )
        ),
        h("main", { className: "pt-6" }, mainView),
        h("footer", { className: "mt-12 pt-4 border-t border-line font-mono text-[11px] text-mute flex justify-between flex-wrap gap-2" },
          h("span", null, h(Logo, { cls: "text-base" }), " · archivo musical federal"),
          h("span", null, dbOk ? "● conectado a base de datos" : "○ modo local")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("r")).render(h(App));
  </script>
</body>
</html>
